<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #eee; }
    h1 { font-size: 2rem; margin-bottom: 1rem; color: #e94560; letter-spacing: 4px; text-transform: uppercase; }
    .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    button { padding: 0.5rem 1.2rem; border: none; border-radius: 8px; background: #e94560; color: white; font-size: 0.9rem; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    button.secondary { background: #16213e; border: 1px solid #e94560; }
    #board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: #e94560; border: 3px solid #e94560; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(233,69,96,0.3); }
    .cell { width: 52px; height: 52px; background: #16213e; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; transition: background 0.15s; user-select: none; }
    .cell:nth-child(3n) { border-right: 2px solid #e94560; }
    .cell:nth-child(9n) { border-right: none; }
    .row-sep { border-bottom: 2px solid #e94560; }
    .cell.given { color: #eee; font-weight: 700; }
    .cell.user { color: #4fc3f7; }
    .cell.selected { background: #0f3460; }
    .cell.highlighted { background: #1a2a4a; }
    .cell.error { color: #e94560 !important; }
    #numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 1.5rem; }
    .num-btn { width: 48px; height: 48px; border-radius: 50%; background: #16213e; border: 1px solid #e94560; color: #eee; font-size: 1.2rem; cursor: pointer; transition: background 0.15s; }
    .num-btn:hover { background: #e94560; }
    #status { margin-top: 1rem; font-size: 1rem; color: #aaa; height: 1.5rem; }
    #timer { font-size: 0.9rem; color: #e94560; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Sudoku</h1>
  <div id="timer">⏱ 00:00</div>
  <div class="controls">
    <button onclick="newGame('easy')">Easy</button>
    <button onclick="newGame('medium')">Medium</button>
    <button onclick="newGame('hard')">Hard</button>
    <button class="secondary" onclick="solvePuzzle()">Solve</button>
  </div>
  <div id="board"></div>
  <div id="numpad"></div>
  <div id="status"></div>
  <script>
    let grid=[],solution=[],given=[],selected=null,seconds=0,timer=null;
    function pad(n){return String(n).padStart(2,'0');}
    function startTimer(){clearInterval(timer);seconds=0;timer=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱ '+pad(Math.floor(seconds/60))+':'+pad(seconds%60);},1000);}
    function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function valid(b,r,c,n){for(let i=0;i<9;i++){if(b[r][i]===n||b[i][c]===n)return false;let br=3*Math.floor(r/3)+Math.floor(i/3),bc=3*Math.floor(c/3)+(i%3);if(b[br][bc]===n)return false;}return true;}
    function solve(b){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(b[r][c]===0){for(let n of shuffle([1,2,3,4,5,6,7,8,9]))if(valid(b,r,c,n)){b[r][c]=n;if(solve(b))return true;b[r][c]=0;}return false;}return true;}
    function newGame(d){document.getElementById('status').textContent='';let b=Array.from({length:9},()=>Array(9).fill(0));solve(b);solution=b.map(r=>[...r]);grid=solution.map(r=>[...r]);let rm=d==='easy'?35:d==='medium'?45:55,removed=0;while(removed<rm){let r=Math.floor(Math.random()*9),c=Math.floor(Math.random()*9);if(grid[r][c]!==0){grid[r][c]=0;removed++;}}given=grid.map(r=>r.map(v=>v!==0));selected=null;startTimer();render();}
    function render(){let board=document.getElementById('board');board.innerHTML='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){let el=document.createElement('div');el.className='cell';if(given[r][c])el.classList.add('given');else if(grid[r][c]!==0){el.classList.add('user');if(grid[r][c]!==solution[r][c])el.classList.add('error');}if(r===2||r===5)el.classList.add('row-sep');if(selected&&selected[0]===r&&selected[1]===c)el.classList.add('selected');else if(selected&&(selected[0]===r||selected[1]===c||(Math.floor(selected[0]/3)===Math.floor(r/3)&&Math.floor(selected[1]/3)===Math.floor(c/3))))el.classList.add('highlighted');el.textContent=grid[r][c]||'';el.onclick=()=>{selected=[r,c];render();};board.appendChild(el);}}
    function input(n){if(!selected)return;let[r,c]=selected;if(given[r][c])return;grid[r][c]=n;render();checkWin();}
    function checkWin(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(grid[r][c]!==solution[r][c])return;clearInterval(timer);document.getElementById('status').textContent='🎉 Solved in '+pad(Math.floor(seconds/60))+':'+pad(seconds%60)+'!';}
    function solvePuzzle(){grid=solution.map(r=>[...r]);clearInterval(timer);render();document.getElementById('status').textContent='✅ Puzzle solved!';}
    let np=document.getElementById('numpad');
    for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num-btn';b.textContent=n;b.onclick=()=>input(n);np.appendChild(b);}
    let er=document.createElement('button');er.className='num-btn';er.textContent='✕';er.onclick=()=>input(0);np.appendChild(er);
    document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')input(parseInt(e.key));if(e.key==='Backspace'||e.key==='Delete')input(0);if(selected){let[r,c]=selected;if(e.key==='ArrowUp'&&r>0)selected=[r-1,c];if(e.key==='ArrowDown'&&r<8)selected=[r+1,c];if(e.key==='ArrowLeft'&&c>0)selected=[r,c-1];if(e.key==='ArrowRight'&&c<8)selected=[r,c+1];render();}});
    newGame('medium');
  </script>
</body>
</html>
